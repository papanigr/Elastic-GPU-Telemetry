syntax = "proto3";

package mq;

option go_package = "github.com/gpu-telemetry-pipeline/mq/pkg/pb";

import "google/protobuf/timestamp.proto";

// MQService defines the gRPC service for message queue operations.
// This is the inter-service communication protocol.
service MQService {
  // Publish sends a message to a topic.
  rpc Publish(PublishRequest) returns (PublishResponse);
  
  // Subscribe registers a consumer with a consumer group.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  
  // Consume retrieves messages for a consumer.
  rpc Consume(ConsumeRequest) returns (ConsumeResponse);
  
  // Ack acknowledges messages have been processed.
  rpc Ack(AckRequest) returns (AckResponse);
  
  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);
}

// Message represents a message in the queue.
message Message {
  string id = 1;
  string topic = 2;
  bytes payload = 3;  // JSON-encoded payload
  google.protobuf.Timestamp timestamp = 4;
}

// PublishRequest is the request to publish a message.
message PublishRequest {
  string topic = 1;
  string id = 2;
  bytes payload = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// PublishResponse is the response after publishing.
message PublishResponse {
  string status = 1;
  string message_id = 2;
}

// SubscribeRequest is the request to subscribe to a topic.
message SubscribeRequest {
  string topic = 1;
  string consumer_id = 2;
  string group = 3;
}

// SubscribeResponse is the response after subscribing.
message SubscribeResponse {
  string status = 1;
  string topic = 2;
  string group = 3;
}

// ConsumeRequest is the request to consume messages.
message ConsumeRequest {
  string topic = 1;
  string consumer_id = 2;
  string group = 3;
  int32 max_messages = 4;
}

// ConsumeResponse is the response with messages.
message ConsumeResponse {
  repeated Message messages = 1;
}

// AckRequest is the request to acknowledge messages.
message AckRequest {
  string topic = 1;
  string consumer_id = 2;
  repeated string message_ids = 3;
}

// AckResponse is the response after acknowledging.
message AckResponse {
  string status = 1;
  int32 acked = 2;
}

// HealthRequest is the health check request.
message HealthRequest {}

// HealthResponse is the health check response.
message HealthResponse {
  string status = 1;
  string timestamp = 2;
}
