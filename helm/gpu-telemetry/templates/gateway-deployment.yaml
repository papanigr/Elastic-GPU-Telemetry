{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
      {{- include "gpu-telemetry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: gateway
        {{- include "gpu-telemetry.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres {{ .Values.postgres.port }}; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: gateway
          image: {{ .Values.global.image.registry }}/{{ .Values.gateway.image.name }}:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gpu-telemetry-config
            - secretRef:
                name: gpu-telemetry-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
{{- end }}
