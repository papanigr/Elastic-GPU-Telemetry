apiVersion: v1
kind: Secret
metadata:
  name: gpu-telemetry-secret
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL Credentials
  POSTGRES_USER: {{ .Values.postgres.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | quote }}
  
  # Database URLs (contains credentials)
  DATABASE_URL: {{ include "gpu-telemetry.postgresUrl" . | quote }}
  COLLECTOR_DATABASE_URL: {{ include "gpu-telemetry.postgresUrl" . | quote }}
  GATEWAY_DATABASE_URL: {{ include "gpu-telemetry.postgresUrl" . | quote }}
