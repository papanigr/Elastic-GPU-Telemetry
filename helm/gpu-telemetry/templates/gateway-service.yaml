{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app: gateway
    {{- include "gpu-telemetry.selectorLabels" . | nindent 4 }}
{{- end }}
