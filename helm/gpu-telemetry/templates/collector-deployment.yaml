{{- if .Values.collector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app: collector
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app: collector
      {{- include "gpu-telemetry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: collector
        {{- include "gpu-telemetry.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres {{ .Values.postgres.port }}; do echo waiting for postgres; sleep 2; done']
        # Wait for MQ to be ready
        - name: wait-for-mq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mq {{ .Values.mq.ports.grpc }}; do echo waiting for mq; sleep 2; done']
      containers:
        - name: collector
          image: {{ .Values.global.image.registry }}/{{ .Values.collector.image.name }}:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            - name: COLLECTOR_CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: gpu-telemetry-config
            - secretRef:
                name: gpu-telemetry-secret
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
{{- end }}
