syntax = "proto3";

package mq;

option go_package = "github.com/gpu-telemetry-pipeline/collector/pkg/pb";

import "google/protobuf/timestamp.proto";

// MQService defines the gRPC service for message queue operations.
// Collector uses Subscribe, Consume, Ack, and Health RPCs.
service MQService {
  // Subscribe registers a consumer with a consumer group.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  
  // Consume retrieves messages for a consumer.
  rpc Consume(ConsumeRequest) returns (ConsumeResponse);
  
  // Ack acknowledges messages have been processed.
  rpc Ack(AckRequest) returns (AckResponse);
  
  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);
}

// Message represents a message in the queue.
message Message {
  string id = 1;
  string topic = 2;
  bytes payload = 3;
  google.protobuf.Timestamp timestamp = 4;
  string state = 5;
  int32 delivery_count = 6;
}

// SubscribeRequest registers a consumer to a topic.
message SubscribeRequest {
  string topic = 1;
  string consumer_id = 2;
  string group = 3;
}

// SubscribeResponse is the response after subscribing.
message SubscribeResponse {
  string status = 1;
  string consumer_id = 2;
}

// ConsumeRequest requests messages from a topic.
message ConsumeRequest {
  string topic = 1;
  string consumer_id = 2;
  string group = 3;
  int32 max_messages = 4;
}

// ConsumeResponse contains the consumed messages.
message ConsumeResponse {
  repeated Message messages = 1;
}

// AckRequest acknowledges processed messages.
message AckRequest {
  string topic = 1;
  string consumer_id = 2;
  repeated string message_ids = 3;
}

// AckResponse is the response after acknowledging.
message AckResponse {
  string status = 1;
  int32 acked_count = 2;
}

// HealthRequest is the health check request.
message HealthRequest {}

// HealthResponse is the health check response.
message HealthResponse {
  string status = 1;
  string timestamp = 2;
}
